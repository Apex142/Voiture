plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

group = mod_group_id
version = mod_version

base {
    archivesName = 'RealisticVehicles'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.lwjgl:lwjgl-vulkan:3.3.3'
    jarJar(group: 'org.lwjgl', name: 'lwjgl-vulkan', version: '[3.3.3,3.4)')

    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.3'
    testImplementation 'com.google.code.gson:gson:2.10.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly 'org.lwjgl:lwjgl:3.3.3:natives-windows'
}

tasks.named('processResources', ProcessResources).configure {
    def replaceProperties = [
        minecraft_version      : minecraft_version,
        minecraft_version_range: minecraft_version_range,
        neo_version            : neo_version,
        neo_version_range      : neo_version_range,
        loader_version_range   : loader_version_range,
        mod_id                 : mod_id,
        mod_name               : mod_name,
        mod_license            : mod_license,
        mod_version            : mod_version,
        mod_authors            : mod_authors,
        mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

tasks.named('jar', Jar).configure {
    archiveFileName = 'RealisticVehicles-1.21.1.jar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
    maxHeapSize = '2G'
    testLogging {
        events 'passed', 'skipped', 'failed'
        showStandardStreams = true
    }
}

def checkFileLength = tasks.register('checkFileLength', Exec) {
    description = 'Verifies no source file exceeds the strict 200-line limit.'
    group = 'verification'
    commandLine 'python', 'tools/check-file-length.py'
}

def checkArchitecture = tasks.register('checkArchitecture', Exec) {
    description = 'Verifies SOLID/DIP isolation of physics and core packages.'
    group = 'verification'
    commandLine 'python', 'tools/check-architecture.py'
}

tasks.named('check').configure {
    dependsOn checkFileLength, checkArchitecture
}
