pluginManagement {
    repositories {
        gradlePluginPortal()
        maven { url = 'https://maven.neoforged.net/releases' }
    }
    resolutionStrategy {
        eachPlugin {
            if (requested.id.id == 'net.neoforged.moddev') {
                useModule('net.neoforged:moddev-gradle:2.0.148')
            }
        }
    }
}

rootProject.name = 'RealisticVehicles'
